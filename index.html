<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Live Draw Arena</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>

    <style>
        :root {
            --neon-gold: #ffb703; --neon-cyan: #00f5d4; --neon-pink: #ff0054;
            --panel-bg: rgba(25, 28, 41, 0.7); --glass-border: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: 'Poppins', sans-serif; background: radial-gradient(circle at center, #161824 0%, #090a0f 100%);
            color: #ffffff; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 30px 15px; min-height: 100vh; box-sizing: border-box;
        }
        .main-container { display: flex; flex-direction: column; align-items: center; max-width: 850px; width: 100%; }
        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 2.4rem; text-transform: uppercase; letter-spacing: 2px; margin: 0; text-align: center;
            background: linear-gradient(to right, #fff, #a0aec0); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .dashboard-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin: 25px 0; }
        .display-card { background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); padding: 15px; border-radius: 12px; text-align: center; }
        .timer-value { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: var(--neon-cyan); }
        .winner-value { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: var(--neon-gold); }
        .wheel-stage { position: relative; width: 480px; height: 480px; margin: 20px 0; }
        .neon-pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
            border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid var(--neon-pink); z-index: 100; filter: drop-shadow(0 0 6px var(--neon-pink));
        }
        .wheel-outer-ring { width: 100%; height: 100%; border-radius: 50%; background: #0b0c12; padding: 10px; box-sizing: border-box; box-shadow: 0 15px 40px rgba(0,0,0,0.7), 0 0 20px rgba(0, 245, 212, 0.1); }
        .wheel { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, #131520 40%, #07080d 100%); position: relative; transition: transform 7s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border-radius: 50%; background: #0d0e15; border: 3px solid var(--neon-cyan); z-index: 10; }
        .wheel-number { position: absolute; width: 30px; height: 230px; left: calc(50% - 15px); transform-origin: bottom center; text-align: center; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; padding-top: 25px; box-sizing: border-box; }
        .wheel-number:nth-child(odd) { color: #ffffff; }
        .wheel-number:nth-child(even) { color: var(--neon-cyan); }
        .form-panel { background: var(--panel-bg); border: 1px solid var(--glass-border); padding: 20px; border-radius: 16px; width: 100%; box-sizing: border-box; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; align-items: center; }
        input, button { background: #191c29; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; color: #fff; font-size: 0.95rem; box-sizing: border-box; }
        button { background: var(--neon-cyan); color: #000; font-weight: 700; cursor: pointer; border: none; }
        .schedule-grid { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 15px; }
        .time-badge { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; color: #718096; }
        .time-badge.active { background: rgba(0, 245, 212, 0.1); color: var(--neon-cyan); border-color: var(--neon-cyan); }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header"><h1>Live Draw Arena</h1></div>
        <div class="dashboard-row">
            <div class="display-card">
                <div style="font-size: 0.8rem; color: #a0aec0; text-transform: uppercase;">Next Session Countdown</div>
                <div class="timer-value" id="timerDisplay">--:--:--</div>
            </div>
            <div class="display-card">
                <div style="font-size: 0.8rem; color: #a0aec0; text-transform: uppercase;">Winning Target</div>
                <div class="winner-value" id="resultDisplay">AWAITING</div>
            </div>
        </div>
        <div class="wheel-stage"><div class="neon-pointer"></div><div class="wheel-outer-ring"><div id="wheel" class="wheel"></div><div class="wheel-center"></div></div></div>
        <div class="form-panel">
            <h3 style="margin-top:0; margin-bottom:15px; font-size:1.1rem; color:var(--neon-gold);">Submit Selections</h3>
            <div class="form-grid">
                <input type="text" id="playerPhone" placeholder="Your Phone Number / Player ID">
                <input type="number" id="chosenNum" placeholder="Number (1-100)" min="1" max="100">
                <input type="number" id="betAmount" placeholder="Amount (₹)" min="1">
            </div>
            <button style="width:100%; margin-top:15px;" onclick="placeWager()">Submit Selections for Verification</button>
        </div>
        <div style="width:100%; text-align:center; background:var(--panel-bg); padding:15px; border-radius:12px; border:1px solid var(--glass-border); box-sizing:border-box;">
            <div style="font-size:0.85rem; color:#a0aec0; text-transform:uppercase; margin-bottom:10px;">Daily Session Framework</div>
            <div class="schedule-grid" id="scheduleList"></div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_fA5Q5BxGFQ8P_-A1s2n65w_SvWFr9zc";

        const SCHEDULE = [
            { time: "11:00", name: "Morning Dev" }, { time: "13:30", name: "Noon Dev" },
            { time: "15:30", name: "Afternoon Dev" }, { time: "18:00", name: "Evening Dev" },
            { time: "20:00", name: "Sunset Dev" }, { time: "22:00", name: "Night Dev" }, { time: "23:50", name: "Midnight Dev" }
        ];
        const wheel = document.getElementById('wheel');
        const timerDisplay = document.getElementById('timerDisplay');
        const resultDisplay = document.getElementById('resultDisplay');
        const scheduleList = document.getElementById('scheduleList');
        let currentRotation = 0, isSpinning = false, activeSessionName = "";

        // Independent Local Setup Engine
        function initWheel() {
            for (let i = 1; i <= 100; i++) {
                const numDiv = document.createElement('div');
                numDiv.className = 'wheel-number'; numDiv.innerText = i;
                numDiv.style.transform = `rotate(${(i - 1) * 3.6}deg)`;
                wheel.appendChild(numDiv);
            }
            SCHEDULE.forEach(item => {
                const badge = document.createElement('span');
                badge.className = 'time-badge'; badge.innerText = `${item.name} (${item.time})`;
                badge.setAttribute('data-time', item.time); scheduleList.appendChild(badge);
            });
        }

        function getNextTargetTime() {
            const now = new Date();
            for (let item of SCHEDULE) {
                const [hrs, mins] = item.time.split(':').map(Number);
                const target = new Date(); target.setHours(hrs, mins, 0, 0);
                if (target > now) return { target, item };
            }
            const [hrs, mins] = SCHEDULE[0].time.split(':').map(Number);
            const target = new Date(); target.setDate(target.getDate() + 1); target.setHours(hrs, mins, 0, 0);
            return { target, item: SCHEDULE[0] };
        }

        function updateClock() {
            if (isSpinning) return;
            const now = new Date(); const { target, item } = getNextTargetTime(); const diff = target - now;
            activeSessionName = item.name;
            document.querySelectorAll('.time-badge').forEach(b => b.classList.remove('active'));
            const activeBadge = document.querySelector(`[data-time="${item.time}"]`);
            if (activeBadge) activeBadge.classList.add('active');
            const hrs = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
            const mins = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            const secs = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
            timerDisplay.innerText = `${hrs}:${mins}:${secs}`;
        }

        // Direct Fetch Integration Engine (Bypasses external imports natively)
        async function runDirectFetch(apiEndpoint, options = {}) {
            const headers = { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json", ...options.headers };
            const response = await fetch(`${SUPABASE_URL}/rest/v1/${apiEndpoint}`, { ...options, headers });
            return response.json();
        }

        async function placeWager() {
            const pId = document.getElementById('playerPhone').value.trim();
            const num = parseInt(document.getElementById('chosenNum').value);
            const amt = parseFloat(document.getElementById('betAmount').value);
